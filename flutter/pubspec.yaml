name: zellio_chat
description: ZeeChat for Flutter. A thin wrapper over the native Zellio iOS and Android chat SDKs. The native SDKs draw all screens.
version: 1.0.0
homepage: https://zellio.ai
repository: https://github.com/zellio-ai/zellio-chat-sdk/tree/main/flutter
issue_tracker: https://github.com/zellio-ai/zellio-chat-sdk/issues

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.zellio.chat.flutter
        pluginClass: ZellioChatPlugin
      ios:
        pluginClass: ZellioChatPlugin
