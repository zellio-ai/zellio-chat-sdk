name: ZellioChatSample
options:
  bundleIdPrefix: ai.zellio.sample
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  ZellioChat:
    path: ..
targets:
  ZellioChatSample:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../contract/v1/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZellioChat
        product: ZellioChat
      - package: ZellioChat
        product: ZellioChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.zellio.sample.chat
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to send to support."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
